name: target_notebook
description: "Target Notebook"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ===== Core =====
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  uuid: ^4.4.2                     # 🆕 生成 userId / inviteId
  crypto: ^3.0.3                   # 🆕 邮箱登录简单 hash（MVP）

  # ===== Storage =====
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ===== UI =====
  table_calendar: ^3.0.9

  # ===== Notifications（🆕 W6 必须）=====
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # ===== Auth（🆕 W6 第三方登录）=====
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  flutter_line_sdk: ^2.3.3

  # ===== AI / Network =====
  http: ^1.2.2
  flutter_dotenv: ^5.1.0   # Debug / 内测用

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  test: ^1.25.15
  flutter_launcher_icons: ^0.13.1

# ===== App Icon =====
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/holidays/
    - assets/brand/
    - .env

