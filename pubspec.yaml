name: target_notebook
description: "Target Notebook"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# ==========================================================
# Dependencies
# ==========================================================
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ===== Core =====
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  uuid: ^4.4.2
  crypto: ^3.0.3

  # ===== Storage =====
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ===== UI =====
  table_calendar: ^3.0.9

  # ===== Notifications =====
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # ===== Auth =====
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  flutter_line_sdk: ^2.3.3

  # ===== AI / Network =====
  http: ^1.2.2
  flutter_dotenv: ^5.1.0

  # ===== Media =====
  image_picker: ^1.2.1

# ==========================================================
# Dev Dependencies
# ==========================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.25.15

  # Hive codegen
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

  # App icon generator
  flutter_launcher_icons: ^0.13.1

# ==========================================================
# App Icon
# ==========================================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/app_icon.png

# ==========================================================
# Flutter Section
# ==========================================================
flutter:
  uses-material-design: true

  assets:
    - assets/holidays/
    - assets/brand/

    # Legal (W7 必需) - zh=繁中 / jp=日文
    - assets/legal/privacy_zh.txt
    - assets/legal/terms_zh.txt
    - assets/legal/privacy_jp.txt
    - assets/legal/terms_jp.txt

    - .env
