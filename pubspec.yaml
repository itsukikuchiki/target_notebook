name: target_notebook
description: "Target Notebook"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ===== Core =====
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # ===== Storage =====
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ===== UI =====
  table_calendar: ^3.0.9

  # ===== AI / Network（🆕 W5 必须）=====
  http: ^1.2.2
  flutter_dotenv: ^5.1.0   # 🔸 Debug / 内测用，正式版可移除

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  test: ^1.25.15
  flutter_launcher_icons: ^0.13.1   # ✅ 必须有

# ✅ App Icon 生成配置
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/holidays/
    - assets/brand/
    - .env   # 🆕 若使用 flutter_dotenv

